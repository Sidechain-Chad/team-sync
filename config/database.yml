# PostgreSQL. Versions 9.3 and up are supported.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: team_sync_development

test:
  <<: *default
  database: team_sync_test

# In production, Render sets DATABASE_URL automatically from the linked
# Postgres database (see render.yaml). Rails picks it up and merges it on
# top of these defaults — no hardcoded credentials needed.
production:
  <<: *default
