# Render Blueprint: defines the web service + Postgres database in one file.
# When you create a new Blueprint on Render and point it at this repo, Render
# reads this file and provisions everything in one go.
#
# Heads-up on the free Postgres plan: it expires 30 days after creation. Fine
# for first deploys and sharing with one or two people, but switch to a paid
# plan ($6/mo Basic-256mb) before that window closes if you're keeping data.

databases:
  - name: team-sync-db
    plan: free
    databaseName: team_sync_production
    user: team_sync

services:
  - type: web
    name: team-sync
    runtime: ruby
    plan: free
    region: oregon          # change if you want a closer region
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: team-sync-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false        # set manually in the Render dashboard
      - key: CLOUDINARY_URL
        sync: false        # set manually in the Render dashboard
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"

      # ---- Mail ----------------------------------------------------------
      # Declared here rather than left to be discovered in production. Every
      # one of these is read by config/environments/production.rb.
      #
      # APP_HOST is the host mail links are built against. If it's unset the
      # app falls back to Render's own RENDER_EXTERNAL_HOSTNAME, so reset links
      # resolve even before a custom domain exists — but set it once you have
      # one, because it also gates the Action Cable origin allowlist above.
      - key: APP_HOST
        sync: false        # set manually in the Render dashboard
      - key: MAILER_FROM
        sync: false        # e.g. no-reply@yourdomain — the From: on every email
      #
      # SMTP. NOTHING SENDS MAIL UNTIL THESE ARE SET — password reset will
      # raise rather than pretend to have delivered. No provider is chosen in
      # code; pick one, then fill these in.
      - key: SMTP_ADDRESS
        sync: false        # provider's SMTP host
      - key: SMTP_PORT
        sync: false        # optional, defaults to 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_DOMAIN
        sync: false        # optional, defaults to APP_HOST

  # Solid Queue supervisor. Without this service nothing processes jobs in
  # production: config/recurring.yml schedules due_soon_scan hourly, but a
  # schedule with no worker running is dead code.
  #
  # `bundle exec ./bin/jobs` is the gem's own documented entry point (README:
  # "you are ready to start processing jobs by running bin/jobs"). It's a Thor
  # CLI whose `default_command` is :start, so the bare invocation starts the
  # supervisor — which in turn reads config/recurring.yml from its default path
  # and runs the scheduler, so the hourly tick needs no extra flag.
  #
  # WEB_CONCURRENCY and RAILS_SERVE_STATIC_FILES are deliberately omitted —
  # both are web-only. Worker concurrency is configured in config/queue.yml
  # (threads, plus JOB_CONCURRENCY for processes), not here.
  #
  # Reusing ./bin/render-build.sh means both services run db:migrate on deploy.
  # That's safe: Rails takes an advisory lock for the duration of a migration,
  # so whichever service arrives second waits rather than racing. Reusing it
  # also guarantees the worker has a precompiled asset manifest, which matters
  # because the worker renders partials when broadcasting Turbo streams.
  - type: worker
    name: team-sync-worker
    runtime: ruby
    plan: starter           # background workers are NOT available on Render's free tier
    region: oregon          # must match the web service and the database
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec ./bin/jobs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: team-sync-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false        # set manually in the Render dashboard
      - key: CLOUDINARY_URL
        sync: false        # set manually in the Render dashboard
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
